<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 230" fill="none">
  <!-- Dynamic Chevron Emblem -->
  <g transform="translate(180, 5) scale(1.1)">
    <!-- Left Dark/Slate bars -->
    <line x1="30" y1="35" x2="65" y2="70" stroke="currentColor" stroke-width="6" stroke-linecap="round" />
    <line x1="45" y1="35" x2="80" y2="70" stroke="currentColor" stroke-width="6" stroke-linecap="round" />
    <line x1="60" y1="35" x2="95" y2="70" stroke="currentColor" stroke-width="6" stroke-linecap="round" />
    <line x1="75" y1="35" x2="110" y2="70" stroke="currentColor" stroke-width="6" stroke-linecap="round" />
    
    <!-- Right Brass/Copper bars -->
    <line x1="140" y1="5" x2="105" y2="40" stroke="#9a7325" stroke-width="6" stroke-linecap="round" />
    <line x1="155" y1="5" x2="120" y2="40" stroke="#9a7325" stroke-width="6" stroke-linecap="round" />
    <line x1="170" y1="5" x2="135" y2="40" stroke="#9a7325" stroke-width="6" stroke-linecap="round" />
    <line x1="185" y1="5" x2="150" y2="40" stroke="#9a7325" stroke-width="6" stroke-linecap="round" />
  </g>

  <!-- SHRADDHA Typography -->
  <text x="250" y="145" font-family="'Source Serif 4', 'Georgia', serif" font-weight="600" font-size="52" letter-spacing="4" text-anchor="middle" fill="currentColor">SHRADDHA</text>
  
  <!-- Horizontal Rule -->
  <line x1="50" y1="162" x2="450" y2="162" stroke="#9a7325" stroke-width="2" opacity="0.8" />
  
  <!-- GROUP Subtitle -->
  <text x="250" y="200" font-family="'Archivo', system-ui, sans-serif" font-weight="400" font-size="28" letter-spacing="14" text-anchor="middle" fill="currentColor">| GROUP |</text>
</svg>
